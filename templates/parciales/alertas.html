{% load formato %}
{% if alertas %}
  <div class="mb-4 space-y-1 rounded p-4 text-sm font-semibold {% if alertas.0.nivel == 'roja' %}bg-red-100 text-red-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">
    {% for a in alertas %}
      <div>{% if a.nivel == 'roja' %}🔴 Tope superado{% else %}🟡 Cerca del tope{% endif %} en {{ a.categoria.nombre }}:
        {{ a.porcentaje|numero:0 }} % ({{ a.gastado|ars }} de {{ a.categoria.tope_mensual|ars }})</div>
    {% endfor %}
  </div>
{% endif %}
