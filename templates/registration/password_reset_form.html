{% extends "registration/_caja.html" %}
{% block subtitulo %}Recuperar contraseña{% endblock %}
{% block caja %}
  <p class="mb-3 text-sm text-gray-600">Ingresá tu email y te mandamos un enlace para elegir una contraseña nueva.</p>
  <form method="post" class="space-y-3">
    {% csrf_token %}
    <input type="email" name="email" placeholder="Email" class="input" required autofocus>
    {% for e in form.email.errors %}<p class="error">{{ e }}</p>{% endfor %}
    <button class="btn-primario w-full">Enviar enlace</button>
  </form>
  <p class="mt-4 text-center text-sm"><a href="{% url 'login' %}" class="link">Volver</a></p>
{% endblock %}
